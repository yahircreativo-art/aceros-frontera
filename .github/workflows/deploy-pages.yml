# Publica el sitio Astro de frontend/ en GitHub Pages.
# URL de preview: https://<usuario>.github.io/<repositorio>/
#
# Configuración única en GitHub (Settings del repositorio):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions:
#        Secrets:   SUPABASE_ANON_KEY
#        Variables: SUPABASE_URL
#                   (opcionales) SUPABASE_PRODUCTS_TABLE, SUPABASE_DESTACADOS_TABLE,
#                   SUPABASE_PROMOS_BUCKET, SITE_URL, SITE_BASE_PATH
#   Con dominio propio (p. ej. acerosfrontera.com) define SITE_URL con ese dominio
#   y SITE_BASE_PATH="/"; sin ellas se usa la URL y la subcarpeta de Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que está en curso.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || steps.pages.outputs.base_path || '/' }}
          # Se aceptan como Variable o como Secret.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_PRODUCTS_TABLE: ${{ vars.SUPABASE_PRODUCTS_TABLE || 'MASTER_PRODUCTOS' }}
          SUPABASE_DESTACADOS_TABLE: ${{ vars.SUPABASE_DESTACADOS_TABLE || 'Promociones' }}
          SUPABASE_PROMOS_BUCKET: ${{ vars.SUPABASE_PROMOS_BUCKET || 'Productos-imagenes' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
