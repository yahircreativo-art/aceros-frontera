  <text x="80" y="392" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" fill="#f7c948">y mayoreo para tu obra</text>
  <text x="80" y="456" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#b3e0c8">Herramientas · Maquinaria · Fijaciones · Seguridad</text>

