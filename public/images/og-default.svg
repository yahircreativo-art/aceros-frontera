      <stop offset="0" stop-color="#062315" />
      <stop offset="0.6" stop-color="#0b3a23" />
      <stop offset="1" stop-color="#0e4a2b" />
    </linearGradient>
    <pattern id="grilla" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.05" />
